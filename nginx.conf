# Log detalhado — mostra upstream info
log_format detailed '$remote_addr - [$time_local] "$request" '
                    'status=$status bytes=$body_bytes_sent '
                    'upstream=$upstream_addr '
                    'upstream_status=$upstream_status '
                    'upstream_time=$upstream_response_time '
                    'request_time=$request_time';

server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout detailed;
    error_log /dev/stderr info;

    # Baseline de segurança para todas as respostas do container (SPA e
    # proxies). HSTS fica no nginx do host, que termina TLS. frame-ancestors
    # 'self': só páginas do próprio domínio (o portal Bongo) podem embutir o
    # site. Nenhum location abaixo define add_header próprio, então todos
    # herdam estes. CSP: scripts só do próprio site (build do Vite, sem
    # script inline); estilos inline porque os componentes usam style={} e o
    # <style> com o @import do Google Fonts; blob: para os downloads/áudio
    # gerados no navegador; APIs (/qrng/api*, /qrng/v1, /qrng/nist) na mesma
    # origem.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # SPA — redireciona rotas para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para API QRNG (Red Pitaya)
    location /api/ {
        proxy_pass http://127.0.0.1:18001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 10s;
    }

    # Stream endpoint com timeout maior
    location /api/stream {
        proxy_pass http://127.0.0.1:18001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }

    # Proxy para FPGA via SSH tunnel
    location /api-fpga/ {
        proxy_pass http://127.0.0.1:18001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 10s;
    }

    # Stream da FPGA com timeout maior
    location /api-fpga/stream {
        proxy_pass http://127.0.0.1:18001/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }
}
