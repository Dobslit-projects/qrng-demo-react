# nginx do STAGING E2E do Kapua QRNG (fase item 2).
# NAO e o nginx de producao. Espelha os CAMINHOS de producao
# (bongo.dobslit.com) mas aponta para os servicos do compose de staging,
# numa rede bridge privada. Servido em HTTP simples na porta 80 do container.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    access_log /dev/stdout;
    error_log  /dev/stderr info;

    # ---- API cliente QRNG (mesmo caminho da producao: /qrng/v1/ -> :3010/v1/) ----
    location /qrng/v1/ {
        proxy_pass http://qrng-client-api:3010/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    # ---- Endpoint publico anonimo (prod: /qrng/api/random -> :3010/v1/public/random) ----
    location = /qrng/api/random      { proxy_pass http://qrng-client-api:3010/v1/public/random; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /qrng/api-fpga/random { proxy_pass http://qrng-client-api:3010/v1/public/random; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }

    # ---- Saude publica (prod: = /qrng/api/health -> client-api /v1/public/health) ----
    location = /qrng/api/health      { proxy_pass http://qrng-client-api:3010/v1/public/health; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /qrng/api-fpga/health { proxy_pass http://qrng-client-api:3010/v1/public/health; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }

    # ---- Stream (prod: so com sessao do portal + limit_conn/limit_rate). Staging: fixture ----
    location = /qrng/api/stream      { proxy_pass http://fixture-upstream:18091/stream; proxy_buffering off; proxy_read_timeout 120s; }
    location = /qrng/api-fpga/stream { proxy_pass http://fixture-upstream:18091/stream; proxy_buffering off; proxy_read_timeout 120s; }

    # ---- Resto do prefixo do broker: NAO exposto (em prod era proxy anonimo
    #      para /v1/raw de 50 MiB, /random_hex, /v1/uint32 -- auditoria 2026-10-01) ----
    location /qrng/api/      { default_type application/json; return 404 '{"error":"NOT_FOUND","message":"Rota nao exposta."}'; }
    location /qrng/api-fpga/ { default_type application/json; return 404 '{"error":"NOT_FOUND","message":"Rota nao exposta."}'; }

    # ---- NIST staging: ESPELHA producao (prod: /qrng/nist/ -> :18002/) ----
    # Versao controlada de nist_service.py com assessment FAKE deterministico.
    # DB / data dir / upload dir isolados. /health expoe environment=staging.
    # proxy_pass com "/" final = mesmo mapeamento da producao: o frontend chama
    # /qrng/nist/nist/status (NIST_API="/qrng/nist" + nistFetch("/nist/status"))
    # -> :18092/nist/status ; e /qrng/nist/health -> :18092/health.
    location /qrng/nist/ {
        proxy_pass http://nist-staging:18092/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # upload grande: nao deixa o nginx bufferizar/limitar antes do app
        client_max_body_size 160m;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
    }

    # ---- Portal (SPA). dist/ e copiado para /usr/share/nginx/html/qrng ----
    location /qrng/ {
        try_files $uri $uri/ /qrng/index.html;
    }
    location = / { return 302 /qrng/; }
}
