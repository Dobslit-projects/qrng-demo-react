# Zonas de limite do Kuapoã (auditoria 2026-10-01). Contexto http.
limit_req_zone  $binary_remote_addr zone=kuapoa_nist_jobs:1m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=kuapoa_stream_ip:1m;
limit_conn_zone $server_name        zone=kuapoa_stream_all:1m;
