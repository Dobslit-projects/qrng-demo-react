server {

    server_name bongo.dobslit.com;

    # pentest-prep 2026-09-30: sem versão no header Server; HSTS uma vez
    # para o domínio (TLS termina aqui; os containers não enviam HSTS).
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/bongo.dobslit.com.access.log;
    error_log  /var/log/nginx/bongo.dobslit.com.error.log;

    client_max_body_size 10m;


    # pentest-prep 2026-09-30: o cookie bongo_session carrega o JWT do Bongo e
    # é validado pela própria API antes de servir /qrng/ e /edu/. Antes,
    # qualquer valor não vazio (ex.: bongo_session=1) passava.
    location = /_bongo_auth {
        internal;
        proxy_pass http://127.0.0.1:3101/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "Bearer $cookie_bongo_session";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @bongo_login {
        return 302 /?redirect=$request_uri;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3101;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /edu {
        return 301 /edu/;
    }

    location /edu/ {
        if ($cookie_bongo_session = "") {
            return 302 /?redirect=$request_uri;
        }
        auth_request /_bongo_auth;
        error_page 401 403 = @bongo_login;
        alias /var/www/edu/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # DobFlight: app Flask (gunicorn, Docker) publicada sob /dobflight.
    # A app usa caminhos absolutos hardcoded no HTML (href="/", href="/tsp",
    # fetch('/api/...')) em vez de url_for() — sem isso o navegador
    # resolveria esses links contra a raiz do dominio, fora de /dobflight.
    # sub_filter reescreve a resposta HTML para manter tudo dentro do
    # prefixo, sem alterar nenhum arquivo da aplicacao Flask.
    location = /dobflight {
        return 301 /dobflight/;
    }

    location /dobflight/ {
        proxy_pass http://127.0.0.1:5000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dobflight;

        sub_filter 'href="/"' 'href="/dobflight/"';
        sub_filter 'href="/tsp"' 'href="/dobflight/tsp"';
        sub_filter '"/api/' '"/dobflight/api/';
        sub_filter "'/api/" "'/dobflight/api/";
        sub_filter '`/api/' '`/dobflight/api/';
        sub_filter_once off;
    }

    # QRNG: itens 6 e 8 da auditoria (2026-08-25). A geracao de bytes
    # (/random) nao aponta mais direto para o broker sem controle nenhum --
    # vai para o endpoint publico controlado do qrng-client-api (rate limit
    # por IP, cota diaria, tamanho maximo, Cache-Control: no-store,
    # X-Request-Id). location mais especifica que /qrng/api/ e
    # /qrng/api-fpga/ abaixo, entao vence para exatamente essas duas rotas.
    # /health e /stream sob esse mesmo prefixo continuam indo direto ao
    # broker por enquanto -- fora do escopo desta passagem.
    location /qrng/api/random {
        proxy_pass http://127.0.0.1:3010/v1/public/random;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 10s;
    }

    location /qrng/api-fpga/random {
        proxy_pass http://127.0.0.1:3010/v1/public/random;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 10s;
    }

    # ── Broker QRNG (auditoria 2026-10-01, SEC-002) ───────────────────────────
    # Antes: `location /qrng/api/ { proxy_pass http://127.0.0.1:18001/; }` expunha
    # TODO o broker sem autenticação nem limite (/stream, /v1/raw de 50 MiB,
    # /random_hex, /v1/uint32) — bypass das cotas da client-api e dreno do buffer
    # físico. Agora só três coisas existem neste prefixo:
    #   /random  → client-api (bloco acima, inalterado)
    #   /health  → client-api /v1/public/health (sem bytes)
    #   /stream  → broker, só com sessão do portal e com limites
    location = /qrng/api/health {
        proxy_pass http://127.0.0.1:3010/v1/public/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        error_page 502 503 504 = @qrng_upstream_down;
    }
    location = /qrng/api-fpga/health {
        proxy_pass http://127.0.0.1:3010/v1/public/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        error_page 502 503 504 = @qrng_upstream_down;
    }

    location = /qrng/api/stream {
        auth_request /_bongo_auth;
        error_page 401 403 = @qrng_unauth;
        error_page 502 503 504 = @qrng_upstream_down;
        limit_conn kuapoa_stream_ip 1;
        limit_conn kuapoa_stream_all 4;
        limit_conn_status 429;
        # limit_rate NAO limita com proxy_buffering off (medido: 1 MiB/s = ritmo
        # do broker). Com buffering ligado, proxy_limit_rate limita a leitura do
        # upstream e limit_rate a entrega ao cliente (2026-10-16).
        limit_rate 256k;
        proxy_pass http://127.0.0.1:18001/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering on;
        proxy_limit_rate 256k;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
    location = /qrng/api-fpga/stream {
        auth_request /_bongo_auth;
        error_page 401 403 = @qrng_unauth;
        error_page 502 503 504 = @qrng_upstream_down;
        limit_conn kuapoa_stream_ip 1;
        limit_conn kuapoa_stream_all 4;
        limit_conn_status 429;
        # limit_rate NAO limita com proxy_buffering off (medido: 1 MiB/s = ritmo
        # do broker). Com buffering ligado, proxy_limit_rate limita a leitura do
        # upstream e limit_rate a entrega ao cliente (2026-10-16).
        limit_rate 256k;
        proxy_pass http://127.0.0.1:18001/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering on;
        proxy_limit_rate 256k;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /qrng/api/ {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND","message":"Rota nao exposta. Use /qrng/v1/ (API) ou /qrng/api/random."}';
    }
    location /qrng/api-fpga/ {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND","message":"Rota nao exposta. Use /qrng/v1/ (API) ou /qrng/api-fpga/random."}';
    }

    location @qrng_unauth {
        default_type application/json;
        return 401 '{"error":"UNAUTHORIZED","message":"Entre no portal para usar este recurso."}';
    }
    location @qrng_upstream_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 503 '{"error":"QRNG_UNAVAILABLE","message":"Servico da fonte indisponivel no momento."}';
    }
    location @qrng_rate_limited {
        default_type application/json;
        add_header Retry-After 30 always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 429 '{"error":"RATE_LIMIT_EXCEEDED","message":"Muitas requisicoes. Tente novamente em instantes."}';
    }


    # QRNG: API de gestao de tokens (client-api) - auth, admin, tokens,
    # /random autenticado, /public/random anonimo, docs.
    location /qrng/v1/ {
        proxy_pass http://127.0.0.1:3010/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 10s;
        # Item 8 da auditoria: sem isso, GET /qrng/v1/docs (sem a barra
        # final) faz o Express redirecionar para /v1/docs/ -- sem o
        # prefixo /qrng, levando a nenhuma location real (ou ao catch-all
        # errado). O redirect do swagger-ui-express nao tem consciencia do
        # proxy reverso; corrigido aqui, nao no codigo da aplicacao.
        proxy_redirect /v1/docs/ /qrng/v1/docs/;
        proxy_redirect /v1/internal/docs/ /qrng/v1/internal/docs/;
    }

    # ── NIST (auditoria 2026-10-01, SEC-007) ──────────────────────────────────
    # Antes: anônimo e sem limite (upload de 128 MiB + suíte C++ por requisição).
    # Agora: só com sessão do portal; disparo de jobs limitado a 2/min por IP.
    location ~ ^/qrng/nist/nist/(upload|run)$ {
        auth_request /_bongo_auth;
        error_page 401 403 = @qrng_unauth;
        error_page 429 = @qrng_rate_limited;
        error_page 502 503 504 = @qrng_upstream_down;
        limit_req zone=kuapoa_nist_jobs burst=3 nodelay;
        limit_req_status 429;
        rewrite ^/qrng/nist/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800;
        client_max_body_size 210m;
    }
    location /qrng/nist/ {
        auth_request /_bongo_auth;
        error_page 401 403 = @qrng_unauth;
        error_page 502 503 504 = @qrng_upstream_down;
        proxy_pass http://127.0.0.1:18002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800;
        client_max_body_size 210m;
    }

    # QRNG: SPA - funcional, protegida por cookie de sessao do Bongo.
    location /qrng/ {
        if ($cookie_bongo_session = "") {
            return 302 /?redirect=$request_uri;
        }
        auth_request /_bongo_auth;
        error_page 401 403 = @bongo_login;
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # QML Platform — experimentos de Quantum Machine Learning
    location = /qml {
        return 301 /qml/;
    }

    location /qml/api/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /qml/ {
        alias /opt/qml-platform/backend/static/;
        index index.html;
        try_files $uri $uri/ /qml/index.html;
    }

    # FARO OSVAT — Next standalone sob subpath /faro (stack em /root/faro,
    # web publica 8090->3000). SEM "/" no fim do proxy_pass: preserva o
    # prefixo (o Next roda com basePath /faro). Host e X-Forwarded-Proto
    # sao obrigatorios: o link de convite nasce deles.
    location /faro {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bongo.dobslit.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bongo.dobslit.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = bongo.dobslit.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name bongo.dobslit.com;
    return 404; # managed by Certbot


}
