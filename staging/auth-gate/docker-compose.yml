# AMBIENTE DE TESTE ISOLADO do gate de autorização do QRNG (doc 155 §1.3).
#
# O nginx roda a configuração de PRODUÇÃO já corrigida por
# apply_nginx_authz.py (render-nginx.py só troca TLS por HTTP :80, os
# endereços 127.0.0.1:PORTA pelos nomes dos serviços e os caminhos de log).
# Bongo (bongosite-auth) e qrng-client-api são o CÓDIGO REAL das branches
# feature/auth-identity-email-20261018. Broker = fixture-upstream (replay
# determinístico). NIST, SPA, front do portal e demais apps = stubs.
#
# Rede `authgate-internal` é `internal: true`: os backends não têm saída para a
# internet (nenhum e-mail real pode sair, MAIL_TRANSPORT=simulated de qualquer
# forma). Só o nginx também está na rede `authgate-edge`, e só ele publica
# porta — em 127.0.0.1.
#
# Segredos: SÓ de teste, gerados a cada `up.sh` em .env (nunca versionado).
#
#   bash up.sh             (gera .env + renderiza o nginx + build + up --wait)
#   node run-matrix.mjs    (matriz de acesso; ver README.md)
#   bash down.sh           (down -v + apaga .env e a config renderizada)

name: kapua-authgate

services:
  bongosite-auth:
    build:
      # Código do portal. Padrão: worktree irmã em PROJETOS DE DESENVOLVIMENTO/Bongo.
      context: ${BONGO_AUTH_DIR:-../../../Bongo/bongosite-wt-auth/back/auth-api}
    image: kapua-authgate-bongosite-auth:local
    container_name: kapua-authgate-bongosite-auth
    environment:
      PORT: "3002"
      DB_PATH: "/data/bongo-authgate.db"
      NODE_ENV: "production"
      JWT_SECRET: "${AUTHGATE_BONGO_JWT_SECRET:?rode up.sh (gera .env com segredos de teste)}"
      ADMIN_SEED_PASSWORD: "${AUTHGATE_ADMIN_SEED_PASSWORD:?rode up.sh (gera .env com segredos de teste)}"
      INTERNAL_SERVICE_TOKEN: "${AUTHGATE_INTERNAL_SERVICE_TOKEN:?rode up.sh (gera .env com segredos de teste)}"
      MAIL_OUTBOX_KEY: "${AUTHGATE_MAIL_OUTBOX_KEY:?rode up.sh (gera .env com segredos de teste)}"
      AUDIT_PSEUDONYM_KEY: "${AUTHGATE_AUDIT_PSEUDONYM_KEY:?rode up.sh (gera .env com segredos de teste)}"
      MAIL_TRANSPORT: "simulated"
      MAIL_WORKER_ENABLED: "1"
      MAIL_WORKER_INTERVAL_MS: "1000"
      MAIL_FROM: "Kuapoã / Dobslit (teste) <notificacoes@authgate.invalid>"
      PUBLIC_BASE_URL: "http://127.0.0.1:${AUTHGATE_PORT:-18180}"
      # QRNG_CLIENT_API_INTERNAL_URL fica de fora DE PROPÓSITO, como em produção
      # (lá o Bongo roda em contêiner bridge e não alcança a client-api em
      # 127.0.0.1:3010): o worker não consulta a client-api; vale o
      # cancelamento ativo (client-api → POST /api/internal/v1/mail/cancel) e o prazo.
      # Fallback do Bongo quando a client-api manda só o token (igual ao padrão do config.js).
      QRNG_LEGACY_RESET_PATH: "/redefinir-senha-api"
      CORS_ORIGINS: "http://127.0.0.1:${AUTHGATE_PORT:-18180}"
      TRUST_PROXY: "1"   # um salto: o nginx deste compose
    volumes:
      - bongo-data:/data
    networks: [authgate-internal]

  qrng-client-api:
    build:
      context: ../../qrng-client-api
    image: kapua-authgate-client-api:local
    container_name: kapua-authgate-qrng-client-api
    depends_on:
      fixture-upstream:
        condition: service_healthy
    environment:
      PORT: "3010"
      BIND_ADDR: "0.0.0.0"
      DB_PATH: "/data/client-api-authgate.db"
      QRNG_UPSTREAM: "http://fixture-upstream:18091"
      QRNG_SOURCE_LABEL: "authgate-fixture-replay"
      QRNG_PROVENANCE: "replay"
      REFUSE_WHEN_SOURCE_OFFLINE: "0"
      TRUST_PROXY: "1"
      JWT_SECRET: "${AUTHGATE_CLIENT_API_JWT_SECRET:?rode up.sh (gera .env com segredos de teste)}"
      ADMIN_EMAIL: "admin-legado@authgate.invalid"
      ALLOW_ADMIN_EMAIL_BOOTSTRAP: "1"   # SÓ teste (produção: scripts/set-role.js)
      INTERNAL_SERVICE_TOKEN: "${AUTHGATE_INTERNAL_SERVICE_TOKEN:?rode up.sh (gera .env com segredos de teste)}"
      AUDIT_PSEUDONYM_KEY: "${AUTHGATE_AUDIT_PSEUDONYM_KEY:?rode up.sh (gera .env com segredos de teste)}"
      BONGO_INTERNAL_URL: "http://bongosite-auth:3002"
      PORTAL_INTROSPECTION_CACHE_MS: "0"       # sem cache: revogação/queda do Bongo visíveis na hora
      PORTAL_INTROSPECTION_TIMEOUT_MS: "2000"
      # Página PÚBLICA do front do portal (Bongo front: LEGACY_API_RESET_PATH),
      # sob `location /`, fora do gate. NUNCA sob /qrng/: lá o gate manda o
      # anônimo / a conta sem qrng para login/cards e o #token= se perde.
      # Definida aqui só porque a borda deste ambiente não é https://bongo.dobslit.com
      # (o padrão do server.js é https://bongo.dobslit.com/redefinir-senha-api).
      QRNG_PASSWORD_RESET_URL: "http://127.0.0.1:${AUTHGATE_PORT:-18180}/redefinir-senha-api"
      QRNG_PUBLIC_BASE_URL: "http://127.0.0.1:${AUTHGATE_PORT:-18180}/qrng/v1"
      RATE_LIMIT_PER_IP_PER_MINUTE: "2000"
      RATE_LIMIT_PER_TOKEN_PER_MINUTE: "300"
      PUBLIC_RATE_LIMIT_PER_IP_PER_MINUTE: "300"
      QRNG_REQUEST_TIMEOUT_MS: "2000"
    volumes:
      - client-api-data:/data
    networks: [authgate-internal]

  fixture-upstream:
    build:
      context: ../fixture-upstream
    image: kapua-authgate-fixture-upstream:local
    environment:
      FIXTURE_SEED: "20261018"
      FIXTURE_POOL_BYTES: "4194304"
      FIXTURE_PROVENANCE: "replay"
    networks: [authgate-internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:18091/health',timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SPA do QRNG (:3001), NIST (:18002), front do portal (:8081) e os demais
  # apps do host (dobflight/qml/faro → :8099): um processo Node sem dependências.
  stubs:
    image: node:20-alpine
    command: ["node", "/stubs/stubs.mjs"]
    volumes:
      - ./stubs:/stubs:ro
    networks: [authgate-internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18002/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.24   # mesma série da VM (nginx/1.24.0 Ubuntu)
    container_name: kapua-authgate-nginx
    depends_on:
      bongosite-auth:
        condition: service_healthy
      qrng-client-api:
        condition: service_healthy
      fixture-upstream:
        condition: service_healthy
      stubs:
        condition: service_healthy
    volumes:
      - ./nginx/rendered/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/rendered/kuapoa-limits.conf:/etc/nginx/conf.d/00-kuapoa-limits.conf:ro
      - ./stubs/edu:/var/www/edu:ro
    ports:
      - "127.0.0.1:${AUTHGATE_PORT:-18180}:80"
    networks: [authgate-internal, authgate-edge]
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  authgate-internal:
    name: kapua-authgate-internal
    internal: true
  authgate-edge:
    name: kapua-authgate-edge

volumes:
  bongo-data:
    name: kapua-authgate-bongo-data
  client-api-data:
    name: kapua-authgate-client-api-data
