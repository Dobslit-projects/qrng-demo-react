name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  client-api:
    name: qrng-client-api (testes + OpenAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qrng-client-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: qrng-client-api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint, ambiente Node da API)
        run: npm run lint

      - name: Lint é um gate efetivo (reprova erro real, aprova arquivo limpo)
        run: node ../scripts/lint-gate.mjs .

      - name: Testes (unitários + integração + contrato OpenAPI)
        run: npm test

      - name: Regenerar especificações OpenAPI (pública + admin interna) e checar drift
        run: |
          npm run openapi:generate
          if ! git diff --quiet -- openapi/qrng-public-v1.yaml openapi/qrng-internal-admin-v1.yaml; then
            echo "::error::openapi/qrng-public-v1.yaml e/ou openapi/qrng-internal-admin-v1.yaml estão desatualizados em relação ao código."
            echo "Rode 'npm run openapi:generate' em qrng-client-api/ e commite o resultado."
            git diff -- openapi/qrng-public-v1.yaml openapi/qrng-internal-admin-v1.yaml
            exit 1
          fi

  frontend:
    name: Frontend (build + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint — frontend + load-tests k6 + configs/e2e)
        run: npm run lint

      - name: Lint é um gate efetivo (reprova erro real, aprova arquivo limpo)
        run: node scripts/lint-gate.mjs src

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  nist-service:
    name: qrng-nist-api (testes Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qrng-nist-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: python3 test/test_nist_service.py

  physical-layer-health:
    name: physical-layer (RCT/APT health tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physical-layer/qrng-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes RCT/APT + maquina de estados de saude (modulo isolado)
        run: python3 -m unittest -v test_qrng_health_tests

      - name: Harness de instrumentacao do pipeline fisico (item 7 - so fixture/replay)
        working-directory: physical-layer/instrumentation
        run: python3 -m unittest -v test_harness

      - name: Tap de captura em stream (item 8 - read-once/forward-once, so replay)
        working-directory: physical-layer/instrumentation
        run: python3 -m unittest -v test_stream_tap

      - name: Harness da restart campaign (item 9 - so piloto fixture, nunca mil)
        working-directory: physical-layer/restart-campaign
        run: python3 -m unittest -v test_harness

  e2e-staging:
    name: E2E Playwright (staging determinístico)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir staging reproduzível (upstream = fixture replay + NIST staging)
        run: |
          export NIST_SERVICE_COMMIT="${GITHUB_SHA}"
          export NIST_SERVICE_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker compose -p kapua-staging -f staging/docker-compose.staging.yml up -d --build
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:18080/qrng/v1/health/self && break || sleep 3
          done
          curl -fsS http://127.0.0.1:18080/qrng/v1/health/self
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:18080/qrng/nist/health && break || sleep 3
          done
          curl -fsS http://127.0.0.1:18080/qrng/nist/health

      - name: Playwright (e2e/staging) — etapa BLOQUEANTE
        run: |
          docker run --rm --network kapua-staging \
            -v "$PWD":/work -w /work \
            -e E2E_BASE_URL=http://web:80 \
            -e FIXTURE_CTL_URL=http://fixture-upstream:18091 \
            -e E2E_STAGING_ONLY=1 -e CI=1 \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            bash -lc "npm ci --no-audit --no-fund && npx playwright test --reporter=list"

      - name: Logs do staging em caso de falha
        if: failure()
        run: docker compose -p kapua-staging -f staging/docker-compose.staging.yml logs --tail=120

      - name: Derrubar staging
        if: always()
        run: docker compose -p kapua-staging -f staging/docker-compose.staging.yml down -v
