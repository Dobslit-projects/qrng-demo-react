  /metrics:
    get:
      tags:
        - Health
      summary: Métricas no formato Prometheus (requests/bytes/erros por status_code em /v1/random).
      description: >
        Fora do prefixo /v1 -- não é versionada como o resto da API pública. Protegida por
        METRICS_TOKEN (env var) quando definida; sem autenticação quando METRICS_TOKEN não está
        configurada.
      security:
        - bearerAuthToken: []
