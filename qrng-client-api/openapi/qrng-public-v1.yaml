# GERADO AUTOMATICAMENTE por `npm run openapi:generate` a partir dos
# comentários @openapi em qrng-client-api/server.js. Não edite este
# arquivo manualmente -- edite os comentários JSDoc no código e rode
# o comando novamente. O CI falha se este arquivo divergir do gerado.
openapi: 3.0.3
info:
  title: Kuapoã QRNG — API Pública
  version: 1.0.0
  description: >-
    API pública do gerador quântico de números aleatórios (QRNG) do Kuapoã/Dobslit. Fonte física:
    FPGA Red Pitaya, stream uint32 little-endian, sem conditioning (confirmado no código-fonte do
    pipeline físico). Bytes brutos são servidos sem processamento adicional; a avaliação de
    min-entropia é feita separadamente pela suíte NIST SP 800-90B (ver aba Teste NIST / /qrng/nist/
    no frontend) — nenhum endpoint aqui certifica ou garante um nível de entropia.


    Unidade de TRANSPORTE (o que esta API entrega): bytes brutos, tal como lidos do registrador AXI
    FIFO da FPGA (4 bytes little-endian por amostra uint32). Unidade de AVALIAÇÃO ESTATÍSTICA (o que
    a suíte NIST SP 800-90B mede sobre uma amostra desses bytes): symbol width de 8 bits por
    decomposição byte a byte -- ver assessment_symbol_width nos resultados de /nist/*. As duas
    unidades são independentes: o formato de transporte não é uma alegação sobre quantos bits têm
    significado físico nem sobre origem quântica comprovada -- isso é o que a avaliação estatística
    separada existe para medir.
  contact:
    name: Dobslit
servers:
  - url: https://bongo.dobslit.com/qrng/v1
    description: Produção (via nginx, proxy para o client-api)
tags:
  - name: Auth
    description: Registro, login e identidade do usuário
  - name: Tokens
    description: Emissão, rotação e revogação de tokens de API pessoais
  - name: Random
    description: Geração de bytes aleatórios (endpoint principal)
  - name: Health
    description: Saúde da API e do upstream FPGA
  - name: Usage
    description: Cota, uso e histórico de chamadas do token
  - name: QRNG Open API
    description: >-
      Interface compatível com o contrato QRNG Open API (github.com/PaloAltoNetworks/QRNG-OPENAPI,
      revisão 812e2055), implementada de forma própria, ao lado das rotas atuais: mesmo token,
      mesmas cotas, mesma fonte. Não é a especificação OpenAPI (Swagger); é um contrato de
      interoperabilidade para obter entropia por REST. Compatibilidade com produtos de terceiros não
      foi testada. Ambiguidades e interpretações: docs/qrng-open-api.md.
  - name: Identity
    description: >-
      Identidade integrada com o portal Bongo: a sessão do portal (cabeçalho X-Portal-Session) é
      validada no Bongo por introspecção; a conta de desenvolvedor do QRNG é criada para ela ou
      vinculada a uma conta antiga (com reautenticação no portal + senha da conta antiga — nunca por
      igualdade de e-mail).
components:
  securitySchemes:
    bearerAuthJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Sessão de usuário (login via /v1/auth/login ou /v1/auth/register). Usada pelos endpoints
        /v1/auth/me, /v1/tokens e /v1/admin/*.
    bearerAuthToken:
      type: http
      scheme: bearer
      description: >-
        Token de API pessoal (formato dobslit_qrng_live_<hex>, emitido por POST /v1/tokens). Usado
        pelos endpoints de consumo: /v1/random, /v1/health. Endpoints /v1/me/* aceitam tanto este
        token quanto o JWT de sessão.
    portalSession:
      type: apiKey
      in: header
      name: X-Portal-Session
      description: >-
        Sessão do portal Bongo (o mesmo JWT do login no portal), em cabeçalho explícito — nunca por
        cookie. Validada no Bongo por introspecção a cada uso (cache curto). Aceita nas rotas
        /identity/*, /auth/me, /tokens, /me/* e /admin/* (o papel de admin é o da conta da
        client-api, não o do portal). Não envie junto um Authorization de OUTRA conta (400
        AMBIGUOUS_CREDENTIALS).
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        O MESMO token de API pessoal de bearerAuthToken, enviado no cabeçalho X-API-Key. Aceito só
        nas rotas QRNG Open API (/capabilities, /entropy, /healthtest). Não envie valores diferentes
        em Authorization e X-API-Key (400 AMBIGUOUS_CREDENTIALS).
  schemas:
    ErrorResponse:
      type: object
      properties:
        request_id:
          type: string
          example: req_a383397963db4222
          nullable: true
        error:
          type: string
          example: INVALID_TOKEN
        message:
          type: string
          example: Token inválido ou revogado.
      required:
        - error
    RandomResponse:
      type: object
      description: >-
        Corpo retornado quando format=hex|base64|uint8 OU quando o parâmetro format é omitido
        (default=hex). Para format=raw o corpo é application/octet-stream com exatamente os N bytes
        brutos (sem este JSON, sem prefixo, sem BOM) — ou use a rota dedicada GET /raw (e
        /public/raw).
      properties:
        request_id:
          type: string
          example: req_a383397963db4222
        source:
          type: string
          example: dobslit-qrng-ufpe-fpga
          description: Rótulo da fonte (env QRNG_SOURCE_LABEL).
        provenance:
          type: string
          enum:
            - live
            - replay
            - fixture
            - historical
            - fallback
            - unknown
          example: live
          description: >-
            Proveniência EFETIVA desta resposta (== provenance_detail.actual_origin). Resolvida por
            resposta: 'live' só com evidência do caminho live (upstream saudável, buffer saudável,
            amostra recente). Uma instância de replay/fixture/histórico nunca reporta 'live'. Também
            no header X-QRNG-Provenance quando format=raw.
        provenance_detail:
          $ref: '#/components/schemas/ProvenanceDetail'
        bytes:
          type: integer
          example: 32
          description: Quantidade de bytes gerados.
        format:
          type: string
          enum:
            - hex
            - base64
            - uint8
          example: hex
        random:
          description: >-
            hex: string hexadecimal (2N caracteres). base64: string base64. uint8: array de N
            inteiros [0,255].
          oneOf:
            - type: string
              example: 5c0eda118fdf680778ecf97c4ab89cb7
            - type: array
              items:
                type: integer
                minimum: 0
                maximum: 255
        timestamp:
          type: string
          format: date-time
      required:
        - request_id
        - source
        - provenance
        - provenance_detail
        - bytes
        - format
        - random
        - timestamp
    ProvenanceDetail:
      type: object
      description: >-
        Contrato de proveniência POR RESPOSTA (item 3). Determina a origem efetiva de cada resposta
        em vez de carimbar tudo pela configuração da instância. Em respostas binárias (format=raw)
        os mesmos campos vão em headers X-QRNG-Provenance / X-QRNG-Live-Verified /
        X-QRNG-Fallback-Used / X-QRNG-Source-Health / X-QRNG-Buffer-Health / X-QRNG-Captured-At /
        X-QRNG-Capture-Id / X-QRNG-Sample-Age-Ms / X-QRNG-Served-At.
      properties:
        configured_source:
          type: string
          example: fpga
          description: Fonte configurada da instância (env QRNG_CONFIGURED_SOURCE).
        instance_mode:
          type: string
          enum:
            - live
            - replay
            - fixture
            - historical
          description: 'Modo/capacidade da instância — teto: nunca eleva uma resposta acima do que pode provar.'
        actual_origin:
          type: string
          enum:
            - live
            - fallback
            - replay
            - fixture
            - historical
            - unknown
          description: >-
            Origem EFETIVA. 'live' só com evidência do caminho live. fallback/replay/historical
            nunca viram 'live'.
        source_health:
          type: string
          enum:
            - healthy
            - degraded
            - failed
            - unknown
        buffer_health:
          type: string
          enum:
            - healthy
            - degraded
            - discontinuous
            - unknown
        captured_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
          format: date-time
        sample_age_ms:
          type: integer
          nullable: true
        capture_id:
          type: string
          nullable: true
        fallback_used:
          type: boolean
          description: >-
            Prevalece sobre a configuração da instância — se true, actual_origin é sempre
            'fallback'.
        live_verified:
          type: boolean
          description: >-
            true só quando há evidência de captura (captured_at) confirmando o caminho live nesta
            resposta.
      required:
        - configured_source
        - actual_origin
        - source_health
        - buffer_health
        - served_at
        - fallback_used
        - live_verified
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT de sessão, válido por 30 dias.
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - user
            - admin
      required:
        - token
        - email
        - role
    TokenInfo:
      type: object
      properties:
        has_token:
          type: boolean
        token_prefix:
          type: string
          example: dobslit_qrng_live_a1b2c3d4
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - revoked
        quota_daily:
          type: integer
        requests_today:
          type: integer
        bytes_today:
          type: integer
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
    TokenIssued:
      type: object
      description: Retornado apenas na criação/rotação — o token completo NUNCA é exibido novamente.
      properties:
        message:
          type: string
        token:
          type: string
          example: dobslit_qrng_live_<40 hex chars>
        prefix:
          type: string
        created_at:
          type: string
          format: date-time
    UsageResponse:
      type: object
      properties:
        has_token:
          type: boolean
        token_name:
          type: string
        status:
          type: string
        quota_daily_requests:
          type: integer
        quota_daily_bytes:
          type: integer
        max_bytes_per_request:
          type: integer
        requests_today:
          type: integer
        bytes_today:
          type: integer
        remaining_requests_today:
          type: integer
        remaining_bytes_today:
          type: integer
        requests_7d:
          type: integer
        bytes_7d:
          type: integer
        requests_30d:
          type: integer
        bytes_30d:
          type: integer
        last_used_at:
          type: string
          format: date-time
          nullable: true
        daily_history:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              requests_count:
                type: integer
              bytes_count:
                type: integer
              errors_count:
                type: integer
    RequestLogEntry:
      type: object
      properties:
        request_id:
          type: string
        endpoint:
          type: string
        bytes_requested:
          type: integer
        format:
          type: string
          nullable: true
        status_code:
          type: integer
        ip_address:
          type: string
        duration_ms:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
    HealthSelfResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: qrng-client-api
        uptime_seconds:
          type: number
        timestamp:
          type: string
          format: date-time
    HealthResponse:
      type: object
      description: >-
        Requer token. `upstream` é a resposta bruta do broker FPGA (ver /health no server_api.py
        upstream — buffer_bytes_available, source_status, stream_format, sample_width_bytes,
        conditioned).
      properties:
        request_id:
          type: string
        status:
          type: string
          example: ok
        api:
          type: string
          example: dobslit-qrng-client-api
        source:
          type: string
          example: ufpe-fpga
        upstream:
          type: object
          additionalProperties: true
    QoaExtension:
      type: object
      description: Objeto de extensão (o contrato só diz "array de objetos JSON"; formato adotado pelo Kuapoã).
      required:
        - name
        - version
        - data
      properties:
        name:
          type: string
          example: kuapoa.limits
        version:
          type: integer
          example: 1
        data:
          type: object
          additionalProperties: true
    QoaTestThreshold:
      type: object
      required:
        - test_type
        - time_stamp
      properties:
        test_type:
          type: string
          example: kuapoa_hw_continuous_rct_apt
        time_stamp:
          type: string
          format: date-time
          description: Instante da última observação (ISO 8601, UTC).
        report_link:
          type: string
          format: uri
    QoaCapabilitiesResponse:
      type: object
      required:
        - entropy
      properties:
        entropy:
          type: object
          required:
            - max_block_size
            - max_block_count
          properties:
            min_block_size:
              type: integer
              example: 1
            max_block_size:
              type: integer
              example: 1048576
              description: Bytes por bloco.
            min_block_count:
              type: integer
              example: 1
            max_block_count:
              type: integer
              example: 1024
            entropy_types:
              type: array
              items:
                type: string
              example:
                - kuapoa_qrng
            extensions:
              type: array
              items:
                $ref: '#/components/schemas/QoaExtension'
              description: >-
                kuapoa.limits (max_total_bytes: block_size × block_count não pode passar disso;
                cotas), kuapoa.entropy_types, kuapoa.contract.
        healthtest:
          type: object
          properties:
            test_threshold:
              type: array
              items:
                $ref: '#/components/schemas/QoaTestThreshold'
            source_count:
              type: integer
              example: 1
            extensions:
              type: array
              items:
                $ref: '#/components/schemas/QoaExtension'
    QoaEntropyRequest:
      type: object
      required:
        - block_size
      properties:
        block_size:
          type: integer
          minimum: 1
          description: Bytes por bloco. Número inteiro JSON (strings, booleanos e frações → 422).
        block_count:
          type: integer
          minimum: 1
          default: 1
          description: Quantidade de blocos.
        entropy_type:
          type: string
          description: 'Padrão: o primeiro de entropy_types em /capabilities.'
          example: kuapoa_qrng
    QoaEntropyResponse:
      type: object
      required:
        - entropy
      properties:
        entropy:
          type: array
          items:
            type: string
            format: byte
          description: block_count strings Base64; cada uma decodifica para exatamente block_size bytes.
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/QoaExtension'
          description: >-
            kuapoa.response: request_id, entropy_type, block_size, block_count, total_bytes,
            conditioned, qualification_status, entropy_health, provenance.
    QoaHealthtestResponse:
      type: object
      required:
        - test_result
      properties:
        test_result:
          type: array
          description: >-
            Só observações atuais. Resultados históricos ficam na extensão
            kuapoa.historical_assessment.
          items:
            type: object
            required:
              - test_type
              - test_result
              - time_stamp
            properties:
              test_type:
                type: string
                enum:
                  - kuapoa_hw_continuous_rct_apt
                  - kuapoa_source_liveness
                  - kuapoa_bitstream_qualification
              test_result:
                type: string
                description: >-
                  Estado observado, em texto: passing | alarm | unavailable | not_assessed | unknown
                  (RCT/APT); online | degraded | offline | unknown (liveness);
                  verified_active_bitstream | ... (qualificação).
              time_stamp:
                type: string
                format: date-time
              report_link:
                type: string
                format: uri
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/QoaExtension'
    DeveloperAccount:
      type: object
      properties:
        id:
          type: integer
          description: Id da conta na client-api (o mesmo de antes do vínculo).
        auth_source:
          type: string
          enum:
            - legacy
            - portal
          description: >-
            legacy = conta antiga (e-mail e senha da client-api); portal = criada pela sessão do
            portal.
        linked_at:
          type: string
          format: date-time
          nullable: true
        has_token:
          type: boolean
          description: Se há token de API ativo.
    IdentityStatus:
      type: object
      properties:
        portal:
          type: object
          properties:
            id:
              type: string
              description: Identificador estável da conta do portal (UUID).
            email:
              type: string
              format: email
              nullable: true
              example: user@example.com
            name:
              type: string
              nullable: true
        developer_account:
          allOf:
            - $ref: '#/components/schemas/DeveloperAccount'
          nullable: true
        can_provision:
          type: boolean
        can_link:
          type: boolean
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
        occurred_at:
          type: string
          format: date-time
        event_type:
          type: string
          example: auth.login
        outcome:
          type: string
          enum:
            - success
            - failure
            - denied
        actor_user_id:
          type: integer
          nullable: true
        target_user_id:
          type: integer
          nullable: true
        request_id:
          type: string
          nullable: true
        ip_prefix:
          type: string
          nullable: true
          description: IPv4 /24 ou IPv6 /48.
        subject_hash:
          type: string
          nullable: true
          description: Pseudônimo HMAC do e-mail (32 hex), só em falhas/eventos anônimos.
        metadata:
          type: object
          nullable: true
          description: Só chaves permitidas (motivo, ids, cotas…); nunca segredos.
  responses:
    PortalSessionInvalid:
      description: Sessão do portal ausente, inválida, expirada ou revogada (PORTAL_SESSION_INVALID).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    QrngAccessDenied:
      description: Sessão do portal válida, mas a conta não tem acesso ao QRNG (QRNG_ACCESS_DENIED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdentityUnavailable:
      description: >-
        Serviço de identidade do portal indisponível (IDENTITY_UNAVAILABLE). Falha fechada: nenhum
        acesso é concedido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AmbiguousPortalCredentials:
      description: >-
        X-Portal-Session enviado junto com um Authorization: Bearer de OUTRA conta (ou inválido)
        (AMBIGUOUS_CREDENTIALS).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DeveloperAccountNotProvisioned:
      description: >-
        Sessão do portal válida, mas sem conta de desenvolvedor do QRNG
        (DEVELOPER_ACCOUNT_NOT_PROVISIONED): use POST /identity/provision ou POST /identity/link.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token ausente, inválido ou expirado (com X-Portal-Session, PORTAL_SESSION_INVALID).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: >-
        Autenticado, mas sem permissão (ex.: rota de admin sem role=admin; INVALID_TOKEN;
        PORTAL_ACCESS_REVOKED quando a conta do portal dona da chave foi desabilitada, perdeu o QRNG
        ou foi excluída).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Limite de requisições por IP ou por token excedido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos até poder tentar novamente.
    QuotaExceeded:
      description: Cota diária de requisições ou bytes excedida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: >-
        Corpo da requisição acima do limite de 8 KiB. Este serviço só aceita corpos JSON pequenos
        (auth/admin); erro estruturado (error=REQUEST_BODY_TOO_LARGE), nunca HTML/stack.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamError:
      description: Upstream FPGA indisponível, com formato inesperado, ou timeout.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /public/health:
    get:
      tags:
        - Health
      summary: Saúde da fonte QRNG (buffer, estado da fonte) — sem autenticação e sem consumir bytes.
      description: >
        Resumo do /health do broker físico, para painéis de status. Não entrega entropia. Resposta
        com cache de poucos segundos no servidor.
      responses:
        '200':
          description: Broker acessível.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  buffer_bytes_available:
                    type: integer
                  buffer_capacity:
                    type: integer
                  total_pushed:
                    type: integer
                  total_popped:
                    type: integer
                  source_status:
                    type: string
                    enum:
                      - online
                      - degraded
                      - offline
                  source_stall_seconds:
                    type: number
                    nullable: true
                  stream_format:
                    type: string
                  sample_width_bytes:
                    type: integer
                  conditioned:
                    type: boolean
                  qualification:
                    type: object
                    nullable: true
                    description: >-
                      Qualificação da fonte (bitstream, perfil de health tests, H_original, h_out
                      pré-restart, restart_validated=false, sp80090b_full_validation=false,
                      operational_ready). Não-nulo só com o bitstream qualificado ativo e
                      verificado.
                  qualification_status:
                    type: string
                    description: >-
                      verified_active_bitstream | inactive_other_bitstream | unverified_stale_probe
                      | unverified_no_probe | none | ...
                  entropy_health:
                    type: string
                    description: >-
                      hw_health_tests_passing | hw_health_alarm | hw_health_unavailable |
                      not_assessed — estado dos health tests RCT/APT do hardware (wrapper lido só em
                      leitura). Não é validação SP 800-90B.
                  provenance:
                    type: string
                    description: >-
                      Origem efetiva: 'live' só com a sonda do hardware
                      (entropy_health=hw_health_tests_passing +
                      qualification_status=verified_active_bitstream + fonte fresca); senão
                      'unknown'.
                  provenance_detail:
                    $ref: '#/components/schemas/ProvenanceDetail'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Broker inacessível (QRNG_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/register:
    post:
      tags:
        - Auth
      summary: Cria uma conta de usuário e retorna um JWT de sessão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                  maxLength: 256
                  description: Letras e números.
      responses:
        '200':
          description: Conta criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: >-
            Campos ausentes, e-mail inválido, senha fraca (< 12, sem letra/número), ou JSON inválido
            (error=INVALID_JSON).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: E-mail já cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          description: Muitos cadastros deste IP (20/hora). error=TOO_MANY_ATTEMPTS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Autentica com e-mail/senha e retorna um JWT de sessão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login bem-sucedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: E-mail ou senha incorretos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          description: Muitas tentativas (50/15 min por IP, 10/15 min por e-mail). error=TOO_MANY_ATTEMPTS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      tags:
        - Auth
      summary: Retorna os dados da conta autenticada.
      security:
        - bearerAuthJWT: []
        - portalSession: []
      responses:
        '200':
          description: Dados do usuário.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                    format: email
                  role:
                    type: string
                    enum:
                      - user
                      - admin
                  created_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/AmbiguousPortalCredentials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/QrngAccessDenied'
        '404':
          $ref: '#/components/responses/DeveloperAccountNotProvisioned'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
    delete:
      tags:
        - Auth
      summary: >-
        Exclui a própria conta (exige a senha). Tokens são apagados; registros de uso ficam
        anônimos.
      security:
        - bearerAuthJWT: []
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Conta excluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        '400':
          $ref: '#/components/responses/AmbiguousPortalCredentials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Senha incorreta (INVALID_PASSWORD). Com X-Portal-Session, também QRNG_ACCESS_DENIED
            (conta do portal sem acesso ao QRNG).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/DeveloperAccountNotProvisioned'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /tokens:
    post:
      tags:
        - Tokens
      summary: Emite o token de API pessoal (um por usuário).
      description: >
        O valor completo do token só é retornado nesta chamada -- apenas o prefixo fica recuperável
        depois via GET /me/token. Use /me/token/rotate para gerar um novo se perdê-lo.
      security:
        - bearerAuthJWT: []
        - portalSession: []
      responses:
        '200':
          description: Token criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenIssued'
        '400':
          $ref: '#/components/responses/AmbiguousPortalCredentials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/QrngAccessDenied'
        '404':
          $ref: '#/components/responses/DeveloperAccountNotProvisioned'
        '409':
          description: Usuário já tem um token ativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /me/token:
    get:
      tags:
        - Tokens
      summary: Retorna metadados do token ativo (nunca o valor completo).
      security:
        - bearerAuthJWT: []
        - bearerAuthToken: []
        - portalSession: []
      responses:
        '200':
          description: Metadados do token, ou { has_token false } se nenhum existir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenInfo'
        '400':
          $ref: '#/components/responses/AmbiguousPortalCredentials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/QrngAccessDenied'
        '404':
          $ref: '#/components/responses/DeveloperAccountNotProvisioned'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /me/token/rotate:
    post:
      tags:
        - Tokens
      summary: Revoga o token atual e emite um novo (mesma cota/nome).
      security:
        - bearerAuthJWT: []
        - bearerAuthToken: []
        - portalSession: []
      responses:
        '200':
          description: Novo token emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenIssued'
        '400':
          $ref: '#/components/responses/AmbiguousPortalCredentials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/QrngAccessDenied'
        '404':
          description: >-
            Nenhum token ativo encontrado. Com X-Portal-Session, também
            DEVELOPER_ACCOUNT_NOT_PROVISIONED (identidade do portal sem conta de desenvolvedor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /me/token/revoke:
    post:
      tags:
        - Tokens
      summary: Revoga o token ativo (sem emitir um novo).
      security:
        - bearerAuthJWT: []
        - bearerAuthToken: []
        - portalSession: []
      responses:
        '200':
          description: Token revogado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  revoked_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/AmbiguousPortalCredentials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/QrngAccessDenied'
        '404':
          description: >-
            Nenhum token ativo encontrado. Com X-Portal-Session, também
            DEVELOPER_ACCOUNT_NOT_PROVISIONED (identidade do portal sem conta de desenvolvedor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /me/usage:
    get:
      tags:
        - Usage
      summary: Cota diária, uso hoje/7d/30d e histórico diário do token.
      security:
        - bearerAuthJWT: []
        - bearerAuthToken: []
        - portalSession: []
      responses:
        '200':
          description: Resumo de uso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '400':
          $ref: '#/components/responses/AmbiguousPortalCredentials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/QrngAccessDenied'
        '404':
          $ref: '#/components/responses/DeveloperAccountNotProvisioned'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /me/requests:
    get:
      tags:
        - Usage
      summary: Histórico das últimas chamadas feitas com o token.
      security:
        - bearerAuthJWT: []
        - bearerAuthToken: []
        - portalSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 10000
          description: Máximo de entradas a retornar.
      responses:
        '200':
          description: Lista de requisições (mais recentes primeiro).
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequestLogEntry'
        '400':
          $ref: '#/components/responses/AmbiguousPortalCredentials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/QrngAccessDenied'
        '404':
          $ref: '#/components/responses/DeveloperAccountNotProvisioned'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /upstream/status:
    get:
      tags:
        - Health
      summary: Histórico de disponibilidade do upstream FPGA (últimas 500 transições, uptime 24h).
      security:
        - bearerAuthJWT: []
        - bearerAuthToken: []
        - portalSession: []
      responses:
        '200':
          description: Status atual, uptime estimado nas últimas 24h e eventos recentes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - up
                          - down
                          - unknown
                      checkedAt:
                        type: string
                        format: date-time
                        nullable: true
                      responseMs:
                        type: integer
                        nullable: true
                  uptime_24h_pct:
                    type: number
                    nullable: true
                  recent_events:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                        response_ms:
                          type: integer
                          nullable: true
                        detail:
                          type: string
                          nullable: true
                        checked_at:
                          type: string
                          format: date-time
        '400':
          $ref: '#/components/responses/AmbiguousPortalCredentials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/QrngAccessDenied'
        '404':
          $ref: '#/components/responses/DeveloperAccountNotProvisioned'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /identity/status:
    get:
      tags:
        - Identity
      summary: Identidade do portal e a conta de desenvolvedor do QRNG ligada a ela (se houver).
      description: >
        Autentica pela sessão do portal (cabeçalho X-Portal-Session), validada no Bongo por
        introspecção. Não cria nem vincula nada: uma conta antiga com o MESMO e-mail não é vinculada
        automaticamente (use /identity/link).
      security:
        - portalSession: []
      responses:
        '200':
          description: Estado da identidade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityStatus'
        '400':
          $ref: '#/components/responses/AmbiguousPortalCredentials'
        '401':
          $ref: '#/components/responses/PortalSessionInvalid'
        '403':
          $ref: '#/components/responses/QrngAccessDenied'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /identity/provision:
    post:
      tags:
        - Identity
      summary: Cria a conta de desenvolvedor do QRNG para a identidade do portal (sem senha local).
      description: >
        A conta nasce vinculada (auth_source=portal), sem e-mail/senha locais — não colide com uma
        conta antiga de mesmo e-mail e não tem login legado. Papel sempre "user" (o papel de
        administrador da client-api não vem do portal). Depois, emita o token de API com POST
        /tokens usando a mesma sessão do portal.
      security:
        - portalSession: []
      responses:
        '201':
          description: Conta criada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  developer_account:
                    $ref: '#/components/schemas/DeveloperAccount'
        '400':
          $ref: '#/components/responses/AmbiguousPortalCredentials'
        '401':
          $ref: '#/components/responses/PortalSessionInvalid'
        '403':
          $ref: '#/components/responses/QrngAccessDenied'
        '409':
          description: A identidade do portal já tem conta de desenvolvedor (PORTAL_ALREADY_LINKED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /identity/link:
    post:
      tags:
        - Identity
      summary: >-
        Vincula uma conta de desenvolvedor ANTIGA (e-mail e senha da client-api) à identidade do
        portal.
      description: >
        Exige prova de controle das duas contas: (1) sessão do portal + reautenticação recente no
        portal (reauthToken de uso único, finalidade link_qrng_developer, obtido em POST
        /api/auth/reauth do portal) e (2) e-mail + senha da conta antiga. Igualdade de e-mail não
        basta. O vínculo mantém id, token de API, cota e histórico; o login antigo continua
        funcionando. Desvinculação só por script administrativo ou pela redefinição de senha da
        conta antiga (POST /auth/password-reset/confirm). Não envie Authorization de outra conta
        junto (400 AMBIGUOUS_CREDENTIALS).
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reauthToken
                - legacyEmail
                - legacyPassword
              properties:
                reauthToken:
                  type: string
                legacyEmail:
                  type: string
                  format: email
                legacyPassword:
                  type: string
                lang:
                  type: string
                  enum:
                    - pt
                    - en
                  description: Idioma do aviso de vínculo enviado ao e-mail da conta antiga (padrão pt).
      responses:
        '200':
          description: Conta vinculada. Um aviso (sem link) é enfileirado para o e-mail da conta antiga.
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked:
                    type: boolean
                  developer_account:
                    $ref: '#/components/schemas/DeveloperAccount'
        '400':
          description: >-
            Campos ausentes (MISSING_FIELDS) ou Authorization de outra conta junto com
            X-Portal-Session (AMBIGUOUS_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/PortalSessionInvalid'
        '403':
          description: >
            REAUTH_REQUIRED (reauthToken ausente, inválido, vencido, já usado ou de outra
            finalidade), INVALID_LEGACY_CREDENTIALS (e-mail/senha da conta antiga incorretos) ou
            QRNG_ACCESS_DENIED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            PORTAL_ALREADY_LINKED (esta identidade já tem conta) ou ACCOUNT_ALREADY_LINKED (a conta
            antiga já está vinculada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          description: >
            Muitas tentativas de vínculo malsucedidas (TOO_MANY_ATTEMPTS): por IP, por conta do
            portal e por conta antiga — este último no MESMO limite do login por e-mail (10/15 min
            somando login e vínculo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/IdentityUnavailable'
  /auth/password-reset/request:
    post:
      tags:
        - Auth
      summary: Pede o link de redefinição de senha de uma conta de desenvolvedor antiga (e-mail e senha).
      description: >
        Resposta SEMPRE 202 genérica, exista a conta ou não (o processamento é feito depois da
        resposta). O link chega por e-mail, vale 30 minutos e é de uso único; um pedido novo
        invalida os anteriores. Contas criadas pelo portal não têm senha local — use a recuperação
        de senha do portal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                lang:
                  type: string
                  enum:
                    - pt
                    - en
                  default: pt
      responses:
        '202':
          description: Pedido recebido (mensagem genérica).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: E-mail ausente ou inválido (INVALID_EMAIL).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          description: Muitos pedidos (10/15 min por IP; 1/min e 5/dia por e-mail). error=TOO_MANY_ATTEMPTS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password-reset/check:
    post:
      tags:
        - Auth
      summary: Diz se um token de redefinição ainda vale, SEM consumi-lo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Resultado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
        '429':
          description: Muitas consultas deste IP (30/15 min). error=TOO_MANY_ATTEMPTS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password-reset/confirm:
    post:
      tags:
        - Auth
      summary: Define a nova senha com o token do e-mail (consumo atômico, uso único).
      description: >
        A regra de senha é verificada ANTES do token. Sucesso revoga todas as sessões (JWT) emitidas
        antes da redefinição, invalida os outros tokens de redefinição da conta, DESFAZ o vínculo
        com uma conta do portal (se houver — quem soube a senha antiga pode tê-la vinculado; para
        vincular de novo use POST /identity/link com a senha nova) e envia um aviso por e-mail. Não
        faz login automático: entre de novo com a nova senha. O token de API NÃO muda: se suspeitar
        de acesso indevido, gere outro em POST /me/token/rotate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
                  maxLength: 256
                  description: Letras e números.
                lang:
                  type: string
                  enum:
                    - pt
                    - en
                  default: pt
      responses:
        '200':
          description: Senha redefinida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: >
            WEAK_PASSWORD (regra de senha) ou INVALID_OR_EXPIRED_TOKEN (token inválido, vencido ou
            já usado — mesma resposta para os três).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          description: Muitas tentativas deste IP (30/15 min). error=TOO_MANY_ATTEMPTS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags:
        - Health
      summary: Saúde do client-api e do upstream FPGA (requer token).
      description: >
        Diferente de /health/self (liveness do processo Node), esta rota consulta o upstream FPGA de
        verdade -- reflete se a fonte física está acessível AGORA, não apenas se a API está no ar.
      security:
        - bearerAuthToken: []
      responses:
        '200':
          description: Upstream respondeu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UpstreamError'
  /random:
    get:
      tags:
        - Random
      summary: Gera bytes aleatórios da fonte QRNG (FPGA Red Pitaya, uint32-LE, sem conditioning).
      description: >
        Confirmado no código-fonte de todo o pipeline físico (auditoria 2026-08-25): o upstream lê
        um registrador AXI FIFO diretamente via mmap na Red Pitaya e grava exatamente 4 bytes
        little-endian por amostra, sem nenhum processamento (whitening/debiasing/conditioning). Esta
        rota entrega esses bytes brutos -- nenhuma avaliação de entropia é feita aqui; ver a suíte
        NIST SP 800-90B separadamente para isso.
      security:
        - bearerAuthToken: []
      parameters:
        - name: bytes
          in: query
          schema:
            type: integer
            minimum: 1
            default: 32
          description: >-
            Quantidade de bytes a gerar. Limite por requisição = MAX_BYTES_PER_REQUEST (padrão 1
            MiB).
        - name: format
          in: query
          schema:
            type: string
            enum:
              - hex
              - base64
              - uint8
              - raw
          description: >
            hex (default — inclusive quando o parâmetro é OMITIDO): JSON RandomResponse com `random`
            = string hexadecimal de 2N caracteres. base64: JSON RandomResponse com `random` = string
            base64 dos N bytes. uint8: JSON RandomResponse com `random` = array de N inteiros
            [0,255]. raw: corpo application/octet-stream com EXATAMENTE os N bytes brutos — sem
            JSON, sem texto, sem prefixo, sem BOM; request_id e proveniência vão nos headers
            X-Request-Id / X-QRNG-Source / X-QRNG-Conditioned. COMPATIBILIDADE: omitir `format`
            retorna JSON (hex), NÃO binário — o binário exige `format=raw` explícito, ou a rota
            dedicada GET /raw.
      responses:
        '200':
          description: >
            Bytes gerados. format=hex|base64|uint8 (ou omitido) → application/json (RandomResponse).
            format=raw → application/octet-stream com N bytes exatos.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador da requisição (também no corpo quando a resposta é JSON).
            X-QRNG-Source:
              schema:
                type: string
              description: 'Proveniência da fonte (ex.: dobslit-qrng-ufpe-fpga). Presente em format=raw.'
            X-QRNG-Conditioned:
              schema:
                type: string
                enum:
                  - 'true'
                  - 'false'
              description: >-
                'true' só quando o broker afirma conditioned=true E
                qualification_status=verified_active_bitstream (bitstream formal com extrator
                Toeplitz 256→128 no FPGA, verificado ATIVO por sonda da placa); 'false' em qualquer
                outro caso, inclusive broker antigo. Presente em todos os formatos.
            X-QRNG-Qualification-Status:
              schema:
                type: string
              description: >-
                Repassado do broker quando presente: verified_active_bitstream |
                inactive_other_bitstream | unverified_stale_probe | unverified_no_probe | none | ...
            X-QRNG-Bitstream-SHA256:
              schema:
                type: string
              description: >-
                SHA-256 do bitstream qualificado verificado ativo. Ausente salvo
                verified_active_bitstream.
            X-QRNG-Entropy-Health:
              schema:
                type: string
                enum:
                  - hw_health_tests_passing
                  - hw_health_alarm
                  - hw_health_unavailable
                  - not_assessed
                  - healthy
                  - degraded
                  - failed
              description: >-
                Estado dos health tests RCT/APT do HARDWARE (registos do wrapper lidos só em leitura
                pela sonda do broker). Não é validação SP 800-90B.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RandomResponse'
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: bytes acima de MAX_BYTES_PER_REQUEST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: bytes ou format inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: >
            Upstream retornou erro OU o Content-Type declarado não é suportado pelo contrato
            (UPSTREAM_UNSUPPORTED_CONTENT_TYPE, UPSTREAM_MISSING_CONTENT_TYPE,
            UPSTREAM_INVALID_JSON, UPSTREAM_JSON_SCHEMA_MISMATCH, UPSTREAM_LENGTH_MISMATCH,
            UPSTREAM_LEGACY_FORMAT_DISABLED) -- ver interpretUpstreamResponse().
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            Upstream indisponível, timeout, ou buffer com menos bytes que o pedido
            (INSUFFICIENT_ENTROPY).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        429_quota:
          description: (usa código 429) Cota diária de requisições ou bytes excedida.
  /raw:
    get:
      tags:
        - Random
      summary: >-
        Alias binário explícito de GET /random?format=raw — application/octet-stream com N bytes
        exatos.
      description: >
        Idêntico a GET /random?format=raw. Rota própria para consumidores que só querem os bytes
        crus sem lidar com o parâmetro format. NUNCA retorna JSON: o corpo são EXATAMENTE os N bytes
        (Content-Length = N), sem prefixo, texto ou BOM. request_id e proveniência vão nos headers
        X-Request-Id / X-QRNG-Source / X-QRNG-Conditioned.
      security:
        - bearerAuthToken: []
      parameters:
        - name: bytes
          in: query
          schema:
            type: integer
            minimum: 1
            default: 32
          description: Quantidade de bytes. Limite = MAX_BYTES_PER_REQUEST (padrão 1 MiB).
      responses:
        '200':
          description: N bytes brutos (application/octet-stream, Content-Length = N).
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador da requisição.
            X-QRNG-Source:
              schema:
                type: string
              description: Proveniência da fonte.
            X-QRNG-Conditioned:
              schema:
                type: string
                enum:
                  - 'true'
                  - 'false'
              description: >-
                'true' só com conditioned=true E verified_active_bitstream do broker; 'false' caso
                contrário. Ver também X-QRNG-Qualification-Status, X-QRNG-Bitstream-SHA256,
                X-QRNG-Entropy-Health.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: bytes acima de MAX_BYTES_PER_REQUEST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: bytes inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: Upstream com erro ou formato inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Upstream indisponível ou entropia insuficiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /capabilities:
    get:
      tags:
        - QRNG Open API
      summary: >-
        QRNG Open API — capacidades da plataforma: limites de bloco, tipos de entropia e testes de
        saúde.
      description: >
        Contrato QRNG Open API (revisão 812e2055 do repositório PaloAltoNetworks/QRNG-OPENAPI),
        implementado de forma própria. Os limites publicados são os que POST /entropy aplica. Como
        max_block_size × max_block_count pode passar do limite total por requisição, o limite total
        vai na extensão `kuapoa.limits` (max_total_bytes). Nenhuma taxa de produção é anunciada. Não
        consome entropia. Conta como 1 requisição na cota diária do token (mesma política de GET
        /health).
      security:
        - bearerAuthToken: []
        - apiKeyHeader: []
      responses:
        '200':
          description: Capacidades.
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QoaCapabilitiesResponse'
        '400':
          description: AMBIGUOUS_CREDENTIALS (Bearer e X-API-Key com valores diferentes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            INVALID_TOKEN, ou PORTAL_ACCESS_REVOKED (a conta do portal dona da chave foi
            desabilitada, perdeu o QRNG ou foi excluída).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Fonte indisponível (broker inacessível ou fonte parada) — código do contrato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /entropy:
    post:
      tags:
        - QRNG Open API
      summary: QRNG Open API — entrega entropia em blocos Base64 (block_size × block_count bytes).
      description: >
        Mesma fonte, mesma aquisição e mesmas cotas de GET /random: a chamada retira do broker
        EXATAMENTE block_size × block_count bytes, divide em block_count blocos e codifica cada
        bloco em Base64. Nunca completa com zeros, PRNG ou repetição: se a fonte não entregar o
        total, a resposta é 503 e nenhum bloco é devolvido. Contabilização: 1 requisição e
        block_size × block_count bytes na cota diária do token (compartilhada com /random e /raw);
        falhas do upstream contam como nas rotas atuais. Proveniência e qualificação vão na extensão
        `kuapoa.response` e nos cabeçalhos X-QRNG-*. Nada da entropia é registrado em logs.
      security:
        - bearerAuthToken: []
        - apiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QoaEntropyRequest'
            examples:
              umBloco:
                summary: Um bloco de 32 bytes
                value:
                  block_size: 32
              variosBlocos:
                summary: Quatro blocos de 64 bytes
                value:
                  block_size: 64
                  block_count: 4
                  entropy_type: kuapoa_qrng
      responses:
        '200':
          description: block_count strings Base64, cada uma com block_size bytes depois de decodificada.
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-QRNG-Conditioned:
              schema:
                type: string
                enum:
                  - 'true'
                  - 'false'
              description: Mesma regra de GET /random.
            X-QRNG-Entropy-Health:
              schema:
                type: string
              description: Estado dos health tests RCT/APT do hardware nesta resposta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QoaEntropyResponse'
        '400':
          description: AMBIGUOUS_CREDENTIALS ou INVALID_JSON (corpo que não é JSON válido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            INVALID_TOKEN, ou PORTAL_ACCESS_REVOKED (a conta do portal dona da chave foi
            desabilitada, perdeu o QRNG ou foi excluída).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: REQUEST_BODY_TOO_LARGE (corpo JSON acima de 8 KiB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: UNSUPPORTED_MEDIA_TYPE (corpo sem Content-Type application/json).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Parâmetro inválido — código do contrato. error: INVALID_REQUEST_BODY |
            MISSING_BLOCK_SIZE | INVALID_BLOCK_SIZE | BLOCK_SIZE_OUT_OF_RANGE | INVALID_BLOCK_COUNT
            | BLOCK_COUNT_OUT_OF_RANGE | UNSUPPORTED_ENTROPY_TYPE | TOTAL_TOO_LARGE. Nenhuma
            entropia é consumida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >-
            RATE_LIMIT_EXCEEDED, QUOTA_EXCEEDED ou QUOTA_BYTES_EXCEEDED (mesmos limites e cotas de
            /random).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: >-
            Upstream com erro (exceto 503/504) ou fora do contrato de transporte (mesmos códigos de
            /random).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            Fonte indisponível — código do contrato. error: QRNG_UNAVAILABLE (broker inacessível,
            timeout ou broker sem os bytes: upstream_status 503/504) | INSUFFICIENT_ENTROPY |
            SOURCE_OFFLINE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /healthtest:
    get:
      tags:
        - QRNG Open API
      summary: >-
        QRNG Open API — estado observado dos testes de saúde da fonte (somente leitura, sem consumir
        entropia).
      description: >
        test_result traz SÓ observações atuais, cada uma com o instante em que foi feita:
        kuapoa_hw_continuous_rct_apt (health tests RCT/APT executados no FPGA sobre cada amostra
        bruta, lidos pela sonda da placa; time_stamp = instante da leitura da sonda),
        kuapoa_source_liveness (fonte enviando dados) e kuapoa_bitstream_qualification (bitstream
        qualificado verificado ativo). Os valores de test_result são texto (passing, alarm,
        unavailable, not_assessed, online, offline…): nenhum número é inventado para representar
        aprovação. Observação vencida aparece como unavailable, nunca como passing. Resultados de
        avaliações offline (H_original, h_out pré-restart, limitações) vão só na extensão
        `kuapoa.historical_assessment`, marcada como não sendo saúde em tempo real. Nada aqui é
        validação SP 800-90B ou certificação. Leitura do broker com cache de até 3 s; conta como 1
        requisição na cota diária do token (mesma política de GET /health).
      security:
        - bearerAuthToken: []
        - apiKeyHeader: []
      responses:
        '200':
          description: >-
            Estado observado (inclusive alarme — um alarme é um resultado, não uma falha desta
            rota).
          headers:
            X-Request-Id:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QoaHealthtestResponse'
        '400':
          description: AMBIGUOUS_CREDENTIALS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            INVALID_TOKEN, ou PORTAL_ACCESS_REVOKED (a conta do portal dona da chave foi
            desabilitada, perdeu o QRNG ou foi excluída).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Fonte dos testes de saúde indisponível (broker inacessível) — código do contrato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/random:
    get:
      tags:
        - Random
      summary: Gera bytes aleatórios da fonte QRNG sem autenticação (acesso público, cota reduzida).
      description: >
        Mesma fonte física de /random (FPGA Red Pitaya via broker QRNG, uint32-LE, sem conditioning)
        -- ver descrição completa em /random. Este caminho NÃO exige token, mas aplica limites bem
        mais restritos por IP (rate limit, cota diária de requisições e bytes, tamanho máximo por
        requisição). Para cotas maiores, crie uma conta e use um token pessoal em /random. Resposta
        sempre com Cache-Control: no-store (nunca cacheie entropia). SEM fallback: se o broker
        físico não responder ou responder em formato inesperado, a requisição falha explicitamente
        (502/503) -- nunca substitui a resposta por dados pré-coletados ou gerados localmente
        rotulados como se fossem esta fonte. `request_id` vem tanto no corpo quanto no header
        `X-Request-Id` da resposta, útil para correlacionar com os logs do servidor em caso de
        suporte. Versão do contrato desta API: ver `info.version` nesta spec.
      parameters:
        - name: bytes
          in: query
          schema:
            type: integer
            minimum: 1
            default: 32
          description: >-
            Quantidade de bytes a gerar. Limite por requisição = PUBLIC_MAX_BYTES_PER_REQUEST
            (padrão 64 KiB).
        - name: format
          in: query
          schema:
            type: string
            enum:
              - hex
              - base64
              - uint8
              - raw
          description: >
            hex (default, inclusive quando omitido), base64, uint8 (array JSON de inteiros 0-255) →
            JSON RandomResponse. raw → application/octet-stream com EXATAMENTE os N bytes brutos
            (sem JSON/texto/prefixo/BOM); request_id e proveniência nos headers X-Request-Id /
            X-QRNG-Source / X-QRNG-Conditioned. Omitir `format` retorna JSON (hex), NÃO binário —
            use `format=raw` ou GET /public/raw.
      responses:
        '200':
          description: >
            Bytes gerados. hex|base64|uint8 (ou omitido) → application/json; raw →
            application/octet-stream com N bytes exatos.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador da requisição (sempre presente).
            X-QRNG-Source:
              schema:
                type: string
              description: Proveniência (presente em format=raw).
            X-QRNG-Conditioned:
              schema:
                type: string
                enum:
                  - 'true'
                  - 'false'
              description: >-
                'true' só com conditioned=true E verified_active_bitstream do broker; 'false' caso
                contrário. Ver também X-QRNG-Qualification-Status, X-QRNG-Bitstream-SHA256,
                X-QRNG-Entropy-Health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RandomResponse'
            application/octet-stream:
              schema:
                type: string
                format: binary
        '413':
          description: bytes acima de PUBLIC_MAX_BYTES_PER_REQUEST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: bytes ou format inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit por IP OU cota diária pública (requests/bytes) excedida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream retornou erro ou formato inesperado -- ver interpretUpstreamResponse().
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Upstream indisponível, timeout, ou entropia insuficiente no buffer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/raw:
    get:
      tags:
        - Random
      summary: Alias binário explícito de GET /public/random?format=raw (anônimo, cota reduzida).
      description: >
        Idêntico a GET /public/random?format=raw. Corpo = EXATAMENTE os N bytes
        (application/octet-stream, Content-Length = N), sem JSON/texto/prefixo/BOM. Mesmos limites
        por IP do /public/random. request_id e proveniência nos headers X-Request-Id / X-QRNG-Source
        / X-QRNG-Conditioned.
      parameters:
        - name: bytes
          in: query
          schema:
            type: integer
            minimum: 1
            default: 32
          description: Quantidade de bytes. Limite = PUBLIC_MAX_BYTES_PER_REQUEST (padrão 64 KiB).
      responses:
        '200':
          description: N bytes brutos.
          headers:
            X-Request-Id:
              schema:
                type: string
            X-QRNG-Source:
              schema:
                type: string
            X-QRNG-Conditioned:
              schema:
                type: string
                enum:
                  - 'true'
                  - 'false'
              description: >-
                'true' só com conditioned=true E verified_active_bitstream do broker; 'false' caso
                contrário. Ver também X-QRNG-Qualification-Status, X-QRNG-Bitstream-SHA256,
                X-QRNG-Entropy-Health.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '413':
          description: bytes acima de PUBLIC_MAX_BYTES_PER_REQUEST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: bytes inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit por IP ou cota pública excedida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream com erro ou formato inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Upstream indisponível ou entropia insuficiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/sample:
    get:
      tags:
        - Random
      summary: Amostra rápida de até 1 MiB numa única resposta (anônimo, binário).
      description: >
        Entrega N bytes brutos (application/octet-stream) numa só resposta, de preferência a partir
        de um pool em memória com bytes recém-recebidos do hardware (cada byte é entregue uma única
        vez; blocos expiram em poucos minutos). Sem pool, busca direto na fonte. Conta na cota
        diária pública por IP (bytes e requisições) e tem limite próprio de amostras por janela.
        Cabeçalhos de proveniência iguais aos de /public/raw, mais X-QRNG-Delivery (prefetch-pool |
        direct) e X-QRNG-Pool-Age-Ms.
      parameters:
        - name: bytes
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1048576
            default: 1048576
      responses:
        '200':
          description: N bytes brutos.
          headers:
            X-Request-Id:
              schema:
                type: string
            X-QRNG-Delivery:
              schema:
                type: string
                enum:
                  - prefetch-pool
                  - direct
            X-QRNG-Pool-Age-Ms:
              schema:
                type: integer
              description: Idade
              em ms: null
              do bloco mais antigo usado na resposta.: null
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '413':
          description: bytes acima do máximo da amostra rápida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: bytes inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Limite de amostras por janela ou cota pública diária excedida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Fonte indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/quota:
    get:
      tags:
        - Health
      summary: Cota pública de hoje para o endereço de rede (IP) que faz a chamada.
      description: >
        Uso e limites do acesso sem token (contados por IP, zeram à meia-noite UTC). Não consome
