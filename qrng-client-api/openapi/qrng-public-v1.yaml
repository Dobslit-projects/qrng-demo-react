                    type: integer
                  bytes_today:
                    type: integer
                  quota_daily_bytes:
                    type: integer
                  max_bytes_per_request:
                    type: integer
                  rate_limit_per_minute:
                    type: integer
                  sample_max_bytes:
                    type: integer
                  sample_per_window:
                    type: integer
                  sample_window_seconds:
                    type: integer
        '429':
          $ref: '#/components/responses/RateLimited'
