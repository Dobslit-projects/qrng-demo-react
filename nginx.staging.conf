# STAGING — item 6 da auditoria do pipeline QRNG.
#
# NÃO É o nginx.conf de produção. Este arquivo demonstra a mudança proposta
# para revisão/teste em staging; não foi aplicado ao processo nginx ao vivo
# do Bongo VM nem substitui nginx.conf. Requer autorização explícita
# separada antes de qualquer deploy em produção (ver relatório da auditoria,
# item 9).
#
# O que muda em relação a nginx.conf: /api/random e /api-fpga/random (o
# caminho que efetivamente entrega bytes de entropia ao público) deixam de
# apontar direto para o broker QRNG (127.0.0.1:18001 -- sem autenticação,
# sem rate limit, sem cota, sem request id, sem Cache-Control) e passam a
# apontar para o endpoint público controlado em qrng-client-api
# (127.0.0.1:3010/v1/public/random), que aplica:
#   - rate limit por IP dedicado (PUBLIC_RATE_LIMIT_PER_IP_PER_MINUTE)
#   - cota diária por IP, requests e bytes (PUBLIC_DAILY_QUOTA_*_PER_IP)
#   - tamanho máximo por requisição menor que o de /v1/random
#   - Cache-Control: no-store e X-Request-Id em toda resposta
#   - log e métricas próprios (/metrics, prefixo qrng_public_*)
#
# Rotas internas continuam bloqueadas simplesmente porque este proxy nunca
# encaminha para elas -- /v1/admin/*, /v1/auth/*, /v1/tokens, /v1/me/*,
# /v1/upstream/status permanecem inacessíveis por este caminho público,
# porque a location abaixo só encaminha para /v1/public/random,
# explicitamente, nunca para o app inteiro.
#
# NÃO alterado nesta passagem (fora do escopo do item 6, que trata do
# acesso à geração de entropia): /api/health e /api/stream continuam
# apontando direto para o broker. Ver relatório da auditoria (item 9) --
# listado como lacuna conhecida para uma passagem futura, não corrigido
# silenciosamente aqui.

log_format detailed '$remote_addr - [$time_local] "$request" '
                    'status=$status bytes=$body_bytes_sent '
                    'upstream=$upstream_addr '
                    'upstream_status=$upstream_status '
                    'upstream_time=$upstream_response_time '
                    'request_time=$request_time';

server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout detailed;
    error_log /dev/stderr info;

    # SPA — redireciona rotas para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Item 6: caminho público controlado (substitui o bypass direto) ────────
    # location mais específica que /api/ e /api-fpga/ abaixo -- nginx usa o
    # prefixo mais longo que casa, então esta regra vence para exatamente
    # /api/random e /api-fpga/random, sem afetar as demais rotas sob /api/.
    location /api/random {
        proxy_pass http://127.0.0.1:3010/v1/public/random;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 10s;
    }

    location /api-fpga/random {
        proxy_pass http://127.0.0.1:3010/v1/public/random;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 10s;
    }

    # ── Inalterado (fora do escopo do item 6 -- ver nota acima) ────────────────

    # Proxy para API QRNG (Red Pitaya)
    location /api/ {
        proxy_pass http://127.0.0.1:18001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 10s;
    }

    # Stream endpoint com timeout maior
    location /api/stream {
        proxy_pass http://127.0.0.1:18001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }

    # Proxy para FPGA via SSH tunnel
    location /api-fpga/ {
        proxy_pass http://127.0.0.1:18001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 10s;
    }

    # Stream da FPGA com timeout maior
    location /api-fpga/stream {
        proxy_pass http://127.0.0.1:18001/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }
}
